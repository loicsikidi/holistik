syntax = "proto3";

package holistik.api.device.v1;

option go_package = "github.com/loicsikidi/holistik/proto/gen/proto/go/holistik/api/device/v1;devicev1";

// OSType represents the operating system of a device.
enum DeviceType {
  DEVICE_TYPE_UNSPECIFIED = 0;
  // Desktop computer.
  DEVICE_TYPE_DESKTOP = 1;
  // Server computer.
  DEVICE_TYPE_SERVER = 2;
}
