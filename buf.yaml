version: v2

modules:
  - path: proto/

lint:
  use:
    - STANDARD
    - COMMENT_ENUM
    - COMMENT_MESSAGE
    - COMMENT_RPC
    - COMMENT_SERVICE
    - PACKAGE_NO_IMPORT_CYCLE
    - PAGINATION_REQUIRED
    - UNARY_RPC
  except:
    - FIELD_NOT_REQUIRED
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_RESPONSE_STANDARD_NAME

breaking:
  use:
    - ENUM_VALUE_NO_DELETE
    - WIRE_JSON

